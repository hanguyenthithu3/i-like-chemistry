
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>I Like Chemistry!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eaf7f0;
      text-align: center;
      padding: 40px 15px;
    }
    .container {
      background: white;
      max-width: 400px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px #0001;
    }
    h1 { color: #16804a; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      background: #16804a;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>I Like Chemistry!</h1>
    <h2>Hóa học kỳ thú THCS</h2>
    <p>Chào mừng các nhà thám hiểm hóa học!</p>

    <input type="text"
           placeholder="Mã học sinh">

    <input type="password"
           placeholder="Mật khẩu">

    <button type="button">
      Đăng nhập
    </button>

    <p>Học mà chơi - Chơi mà học</p>
  </div>
</body>
</html>
